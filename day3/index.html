<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAY3-Forms</title>
    <style>
        /* basic css */
        .first-third-col {
            padding-left: 200px;
        }

        .second-four-col {
            padding-left: 0px;
            
        }

        .button {
            text-align: center;
        }
    </style>
</head>

<body>
    <fieldset>
        <legend><b>Registration Form</b></legend>
        <form action="" width="100%">
            <table width="100%" cellpadding="5">
                <tr>
                    <td class="first-third-col">Student <br>Name</td>
                    <td class="second-four-col"><input type="text" placeholder="First Name"></td>
                    <td class="first-third-col"><input type="text" placeholder="Middle Name"></td>
                    <td class="second-four-col"><input type="text" placeholder="Last Name"></td>
                </tr>
                <tr>
                    <td class="first-third-col">Father's<br>Name</td>
                    <td class="second-four-col"><input type="text" placeholder="Enter Your Father's Name"></td>
                    <td class="first-third-col">Mother's Name</td>
                    <td class="second-four-col"><input type="text" placeholder="Enter your Mother's Name"></td>
                </tr>
                <tr>
                    <td class="first-third-col">Date of <br>Birth</td>
                    <td class="second-four-col"><input type="date"></td>
                    <td class="first-third-col">Gender</td>
                    <td class="second-four-col"><label for="">Male</label>
                        <input type="radio" name="Gender">
                        <label for="">Female</label>
                        <input type="radio" name="Gender">
                    </td>
                </tr>
                <tr>
                    <td class="first-third-col">Category</td>
                    <td class="second-four-col">
                        <label for="">Gen
                            <input type="radio" name="category" id="">
                            OBC <input type="radio" name="category" id="">
                            SC/ST <input type="radio" name="category" id="">
                        </label>

                    <td class="first-third-col">Handicapped</td>
                    <td class="second-four-col">
                        <label for="">
                            Yes <input type="radio" name="handicapped" id="">
                            No <input type="radio" name="handicapped">
                        </label>
                    </td>
                <tr>
                    <td class="first-third-col">Ex- <br>Serviceman</td>
                    <td class="second-four-col"><label for="">
                            Yes <input type="radio" name="ex" id="">
                            No <input type="radio" name="ex">
                        </label></td>
                    <td class="first-third-col">EWS</td>
                    <td class="second-four-col"><label for="">
                            Yes <input type="radio" name="ews" id="">
                            No <input type="radio" name="ews">
                        </label></td>
                </tr>
                <tr>
                    <td class="first-third-col">Email ID</td>
                    <td class="second-four-col"><input type="text"></td>
                    <td class="first-third-col">Mobile No.</td>
                    <td class="second-four-col"><input type="number"></td>
                </tr>
                <tr>
                    <td class="first-third-col">State</td>
                    <td class="second-four-col"><select name="" id="">
                            <option value="" selected disabled>Select Any One</option>
                            <option value="">Jammu and Kashmir</option>
                            <option value="">Punjab</option>
                        </select></td>
                    <td class="first-third-col">City</td>
                    <td class="second-four-col">
                        <select name="" id="">
                            <option value="" selected disabled>Select Any One</option>
                            <option value="">Jalandhar</option>
                            <option value="">Amritsar</option>
                            <option value="">Srinagar</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="first-third-col">Upload <br>Photo</td>
                    <td class="second-four-col">
                        <label for=""><input type="file"></label>
                    </td>
                    <td class="first-third-col">Upload Signature</td>
                    <td class="second-four-col">
                        <label for=""><input type="file" name="" id=""></label>
                    </td>
                </tr>
                <tr>
                    <td colspan="4" class="button">
                        <button type="submit">Submit</button>
                    </td>
                </tr>
            </table>

        </form>
    </fieldset>

</body>

</html>
