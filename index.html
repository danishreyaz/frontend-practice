<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta login page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 <link rel="stylesheet" href="style.css">
    <style>

    </style>
</head>

<body>
    <!-- main section -->
    <div class="container-fluid p-0 bg-dark login-page">
        <div class="row  g-0 ">
            <!-- left side image start -->
            <div class="col-md-6 col-sm-12 banner">
                <img src="./image/image.png" alt="logo-image">
            </div>
            <!-- left side image end -->

            <!-- login form start -->
            <div class="col-md-6 col-sm-12 pt-5">
                <div class="container mt-5">
                    <h3>Log into Instagram</h3>
                    <form>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label"></label>
                            <input type="email" class="form-control bg-dark" id="exampleInputEmail1"
                                aria-describedby="emailHelp" placeholder="Mobile Number,Username or Email">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label"></label>
                            <input type="password" class="form-control bg-dark" id="exampleInputPassword1"
                                placeholder="Password">
                        </div>
                        <button type="submit" class="btn btn-primary">Login</button>

                        <button type="submit" class="btn  btn-dark mt-3">Forgot Pasword</button>
                        <button type="submit" class="btn btn-dark mt-5">Login in with Facebook</button>
                        <button type="submit" class="btn btn-dark mt-3" id="create-btn">Create New Account</button>
                    </form>
                </div>
            </div>
            <!-- login form end -->
        </div>
    </div>
    <!-- footer -->
    <div class="container-fluid footer">
        <div class="row text-light text-center p-5 fw-light">
            <div class="row footer-row-1 ">
                <div class="col">
                    <a href="#">Meta</a>
                    <a href="">About</a>
                    <a href="">Blog</a>
                    <a href="">Job</a>
                    <a href="">Help</a>
                    <a href="">API</a>
                    <a href="">Privacy</a>
                    <a href="">Terms</a>
                    <a href="">Location</a>
                    <a href="">Popular</a>
                    <a href="">Instagram Lite</a>
                    <a href="">Meta AI</a>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col">
                    <select name="option" id="" class=" bg-transparent text-light border-0">
                        <option value="" class="text-dark">English</option>
                        <option value="" class="text-dark">Urdu</option>
                        <option value="" class="text-dark">Hindi</option>
                        <option value="" class="text-dark">Punjabi</option>
                    </select>
                    <span>© 2026 Instagram from Meta</span>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
