<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-5 task</title>
    <style>

        .flower {
            /* box-sizing: border-box; */
            width: 400px;
            height: 300px;
            position: absolute;
            left: 60px;
            top: 60;

        }

        .petal {
            width: 120px;
            height: 120px;
            background-color: rgba(234, 126, 144, 0.833);
            border-top-right-radius: 100%;
            border-bottom-left-radius: 100%;
            position: absolute;
            /* position: relative; */
        }

        .p1 {
            transform: rotate(-10deg);
            left: 30px;
            top: 60px;
            background-color: rgba(249, 75, 104, 0.776);

        }

        .p2 {
            transform: rotate(20deg);
            left: 60px;
            top: 32px;
            background-color: rgba(249, 75, 104, 0.911);
        }

        .p3 {
            transform: rotate(45deg);
            left: 100px;
            top: 24px;
            background-color: rgba(249, 75, 104);
        }

        .p4 {
            transform: rotate(65deg);
            left: 132px;
            top: 30px;
            background-color: rgba(249, 75, 104, 0.884);
        }

        .p5 {
            transform: rotate(100deg);
            left: 160px;
            top: 60px;
            background-color: rgba(249, 75, 104, 0.623);
        }

        .stem {
            width: 20px;
            height: 300px;
            background: rgb(17, 176, 17);
            position: absolute;
            top: 176px;
            left: 210px;
        }

        .leaf-1 {
            width: 120px;
            height: 120px;
            position: absolute;
            background: rgb(17, 176, 17);
            border-top-right-radius: 100%;
            border-bottom-left-radius: 100%;
            transform: rotate(-10deg);
            top: 200px;
            left: 84px;
        }

        .leaf-2 {
            width: 120px;
            height: 120px;
            position: absolute;
            transform: rotate(90deg);
            background: rgb(17, 176, 17);
            border-top-right-radius: 100%;
            border-bottom-left-radius: 100%;
            top: 240px;
            left: 228px;
        }

        .base {
            width: 200px;
            height: 20px;
            position: absolute;
            background: rgb(17, 176, 17);
            top: 470px;
            left: 120px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="lotus">
        <div class="flower">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
        </div>
        <div class="stem">
        </div>
        <div class="leaf-1"></div>
        <div class="leaf-2"></div>
        <div class="base"></div>
    </div>
</body>

</html>
